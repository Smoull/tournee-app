[project]
name = "landing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "cairosvg",
    "pillow",
    "httpx>=0.28.1",
    "fonttools>=4.66.1",
    "brotli>=1.2.0",
    "pytailwindcss>=0.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
